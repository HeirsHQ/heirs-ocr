name: API CI

# Backend (OCR service) only. The frontend apps in web/ have their own workflow
# (web-ci.yaml); changes confined to web/ don't trigger this one.
on:
  push:
    branches:
      - main
      - staging
      - development
    paths-ignore:
      - "web/**"
  pull_request:
    branches:
      - main
      - staging
      - development
    paths-ignore:
      - "web/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Build API
        run: pnpm run build:api
