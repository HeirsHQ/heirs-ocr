name: Web CI

# Frontend workspace (web/) only — the admin console and tenant portal, built and
# linted independently of the OCR service. Runs only when web/ changes.
on:
  push:
    branches:
      - main
      - staging
      - development
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yaml"
  pull_request:
    branches:
      - main
      - staging
      - development
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yaml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck packages
        run: pnpm run typecheck

      # Builds both apps (apps/admin + apps/tenant); each app's build type-checks it.
      - name: Build apps
        run: pnpm run build
