name: Build and Deploy Frontend

# Builds and pushes the two frontend app images (admin console + tenant portal) to
# ECR, then deploys them. Mirrors the backend's dev-deploy.yml (same AWS role/host
# secrets). Runs only when the frontend changes.
#
# Provisioning this expects (one-time, outside this file):
#   - two ECR repos: heirs-admin-web, heirs-tenant-web
#   - a host-side scripts/deploy-web.sh that pulls the tags and restarts the apps
#     (e.g. via web/docker-compose.yml), pointing each at the deployed OCR_API_URL.
on:
  push:
    branches: [development]
    paths:
      - "web/**"
      - ".github/workflows/web-deploy.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1

concurrency:
  group: deploy-web-development
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: admin
            repository: heirs-admin-web
          - app: tenant
            repository: heirs-tenant-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          # Build context is the web/ workspace so the shared packages are available.
          context: ./web
          file: web/apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ matrix.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            bash /home/ubuntu/heirs-ocr/scripts/deploy-web.sh ${{ github.sha }}
