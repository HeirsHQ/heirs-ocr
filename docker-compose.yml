# OCR service: `api` + `worker`, one image, config from .env.
#
#   docker compose up --build                        # api + worker
#   docker compose --profile local-infra up --build  # + postgres, redis, minio
#
# The admin console and tenant portal live in web/docker-compose.yml.

services:
  api:
    build: .
    image: heirs-ocr
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8080"
      # The `worker` service runs the background work; keep it off the request path
      # here. Unset (the default) means a lone container does everything itself.
      RUN_BACKGROUND_WORKERS: "false"
    ports:
      - "8080:8080"

  worker:
    build: .
    image: heirs-ocr
    command: ["node", "build/worker.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production

  redis:
    profiles: ["local-infra"]
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    profiles: ["local-infra"]
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-heirs_ocr}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-heirs_ocr}"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    profiles: ["local-infra"]
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-shot: creates the bucket, then exits. The API never creates it on demand.
  minio-init:
    profiles: ["local-infra"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-heirs-ocr-documents}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        echo "bucket $$S3_BUCKET ready"

volumes:
  pgdata:
  miniodata:
