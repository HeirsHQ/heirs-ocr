# Production stack, used by scripts/deploy.sh on the EC2 host.
#
# Images are pulled from ECR, never built here — deploy.sh exports ECR_REGISTRY,
# ECR_REPOSITORY and IMAGE_TAG, then runs:
#
#   docker compose -f docker-compose-prod.yml pull
#   docker compose -f docker-compose-prod.yml up -d --remove-orphans
#
# Postgres, Redis and object storage are managed services here; their URLs come from
# .env on the host (not in the repo — .env is gitignored).

services:
  api:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8080"
      # The `worker` service below runs the background work, so keep it off the
      # request path here. Remove this line if the worker is ever dropped — the
      # default is `true`, which makes a lone api container self-sufficient.
      RUN_BACKGROUND_WORKERS: "false"
    ports:
      - "8080:8080"

  # Drains the OCR queue, runs the retention sweep, and delivers webhooks. Without
  # this container those never happen — queued documents sit unprocessed and webhook
  # deliveries queue in the database without being sent.
  worker:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
    command: ["node", "build/worker.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
